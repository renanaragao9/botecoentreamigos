services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file: .env
    environment:
      DB_HOST: servidor-mysql
    volumes:
      - storage:/var/www/html/storage
    networks:
      - servidor-shared

networks:
  servidor-shared:
    external: true

volumes:
  storage:
